<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090909">
  <title>depre??ed</title>
  <meta name="description" content="depre??ed — discord bio">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-img" id="bg-img"></div>
  <canvas id="rain"></canvas>
  <canvas id="particles"></canvas>
  <canvas id="visualizer"></canvas>
  <div class="vignette"></div>
  <div class="cursor-glow" id="cursor-glow"></div>
  <div class="cursor-ring" id="cursor-ring"></div>
  <div class="cursor-dot" id="cursor-dot"></div>

  <!-- hud -->
  <div class="hud hud-tl">depre??ed</div>
  <div class="hud hud-tr" id="clock">00:00:00</div>

  <!-- enter splash -->
  <div class="enter" id="enter">
    <div class="enter-name" id="enter-name" data-text="DEPRE??ED">DEPRE??ED</div>
    <div class="enter-sub" id="enter-sub">никуда не спешу</div>
    <div class="enter-loading"><div class="enter-loading-fill" id="loading-fill"></div></div>
    <div class="enter-pct" id="enter-pct">0%</div>
    <div class="enter-hint hidden" id="enter-hint">[ click or press any key ]</div>
  </div>

  <main class="card" id="card">
    <!-- nameplate из discord collectibles -->
    <video class="nameplate" autoplay muted loop playsinline disablepictureinpicture>
      <source src="https://cdn.discordapp.com/assets/collectibles/nameplates/tarot/manifesting_magic/asset.webm" type="video/webm">
    </video>

    <div class="avatar-wrap">
      <img id="avatar" class="avatar" src="https://cdn.discordapp.com/avatars/1426335709333291048/200e5998580869826019a400501a3ab6.png?size=256" alt="avatar" draggable="false">
      <img id="avatar-deco" class="avatar-deco" src="https://cdn.discordapp.com/avatar-decoration-presets/a_a78819f4d41900aa7698a1bafaf6af41.png" alt="" draggable="false">
      <span id="status-dot" class="status-dot offline"></span>
    </div>

    <h1 class="name" id="name"><span id="name-main">DEPRE??ED</span></h1>

    <div class="clan" id="clan">
      <img id="clan-badge" src="https://cdn.discordapp.com/clan-badges/1518745235130159225/b3b3aa7cd2cc6ac2256de6376e3f74f4.png" alt="">
      <span id="clan-tag">NZ</span>
    </div>

    <p class="name-sub" id="name-sub">никуда не спешу</p>

    <!-- бейджи — редактируй здесь -->
    <div class="badges">
      <span class="badge" id="badge-handle">@sadgirlsyndrom3</span>
      <span class="badge">1337</span>
      <span class="badge">DISCORD</span>
    </div>

    <!-- подсвеченные строки — редактируй здесь -->
    <div class="hl-lines">
      <span class="hl">DISCORD CONNECTED</span>
      <span class="hl">ЖИВОЙ СТАТУС 24/7</span>
    </div>

    <p class="typing"><span id="typed"></span><span class="caret"></span></p>

    <p class="presence"><span id="presence-text">connecting…</span></p>
    <p class="custom-status hidden" id="custom-status"></p>

    <!-- live discord activity -->
    <div class="activity hidden" id="activity">
      <img id="activity-img" class="activity-img hidden" src="" alt="">
      <div class="activity-info">
        <span class="activity-label" id="activity-label"></span>
        <span class="activity-title" id="activity-title"></span>
        <span class="activity-sub" id="activity-sub"></span>
        <div class="progress hidden" id="progress"><div class="progress-fill" id="progress-fill"></div></div>
      </div>
      <div class="eq hidden" id="eq"><span></span><span></span><span></span><span></span></div>
    </div>

    <div class="socials">
      <a class="soc" href="https://discord.gg/YPQYxJjddX" target="_blank" rel="noopener" draggable="false" data-tip="Discord server">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M20.32 4.37a19.8 19.8 0 0 0-4.93-1.51 13.8 13.8 0 0 0-.64 1.28 18.3 18.3 0 0 0-5.5 0 13.8 13.8 0 0 0-.64-1.28c-1.71.29-3.37.8-4.93 1.51A20.3 20.3 0 0 0 .1 18.06a19.9 19.9 0 0 0 6.07 3.03c.49-.66.93-1.37 1.3-2.1a12.9 12.9 0 0 1-2.05-.98c.17-.12.34-.25.5-.38a14.2 14.2 0 0 0 12.16 0c.16.13.33.26.5.38-.65.38-1.34.71-2.05.98.37.73.81 1.44 1.3 2.1a19.9 19.9 0 0 0 6.07-3.03 20.3 20.3 0 0 0-3.58-13.69ZM8.02 15.33c-1.18 0-2.16-1.08-2.16-2.42s.95-2.42 2.16-2.42 2.18 1.09 2.16 2.42c0 1.34-.95 2.42-2.16 2.42Zm7.96 0c-1.18 0-2.16-1.08-2.16-2.42s.95-2.42 2.16-2.42 2.18 1.09 2.16 2.42c0 1.34-.95 2.42-2.16 2.42Z"/></svg>
      </a>
    </div>
  </main>

  <!-- music player -->
  <div class="player hidden" id="player">
    <div class="disc" id="disc">
      <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6Z"/></svg>
    </div>
    <button class="p-btn" id="prev" type="button" title="prev [←]">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M6 6h2v12H6V6Zm3.5 6 8.5 6V6l-8.5 6Z"/></svg>
    </button>
    <button class="p-btn" id="play" type="button" title="play/pause [space]">
      <svg id="play-icon" viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M8 5v14l11-7L8 5Z"/></svg>
    </button>
    <button class="p-btn" id="next" type="button" title="next [→]">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M16 6h2v12h-2V6ZM6 18l8.5-6L6 6v12Z"/></svg>
    </button>
    <div class="track">
      <span class="track-title" id="track-title">no tracks</span>
      <div class="seek" id="seek"><div class="seek-fill" id="seek-fill"></div></div>
      <span class="track-time" id="track-time"></span>
    </div>
    <input class="volume" id="volume" type="range" min="0" max="100" value="45" title="volume">
  </div>

  <!-- тост при смене трека -->
  <div class="toast" id="toast"></div>

  <footer class="footer"><span id="footer-name">sadgirlsyndrom3</span><span id="views"></span></footer>

  <script src="playlist.js"></script>
  <script src="script.js"></script>
</body>
</html>
